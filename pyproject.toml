[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-hit-expander-boltz2"
version = "1.0.0"
description = "RDKit hit expansion, Boltz-2 cofolding analysis, and protein–ligand interaction fingerprints"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "rdkit>=2023.9",
    "PyYAML>=6.0",
    "matplotlib>=3.7",
    "ipywidgets>=8.0",
    "ipython>=8.0",
    "gemmi>=0.6",
    "py3Dmol>=2.0",
    "plip>=2.3",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
open_hit_expander = ["*.html"]
